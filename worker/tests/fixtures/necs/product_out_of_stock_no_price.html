<!DOCTYPE html>
<html lang="es">
<head>
    <title>Producto Agotado - NECS</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "Componente Descontinuado",
        "sku": "9999",
        "offers": {
            "@type": "Offer",
            "priceCurrency": "PEN",
            "availability": "https://schema.org/OutOfStock"
        }
    }
    </script>
</head>
<body>
    <h1 class="product-detail-name">Componente Descontinuado</h1>
    <div id="product-availability">
        <span class="badge badge-secondary">Agotado</span>
    </div>
</body>
</html>
