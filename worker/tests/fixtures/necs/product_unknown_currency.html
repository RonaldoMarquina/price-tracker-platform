<!DOCTYPE html>
<html lang="es">
<head>
    <title>Producto con Moneda Invalida - NECS</title>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org/",
        "@type": "Product",
        "name": "Producto Moneda Invalida",
        "sku": "EUR-01",
        "offers": {
            "@type": "Offer",
            "priceCurrency": "EUR",
            "price": "99.00",
            "availability": "https://schema.org/InStock"
        }
    }
    </script>
</head>
<body>
    <h1>Producto Moneda Invalida</h1>
    <span itemprop="price">99.00 €</span>
    <div id="product-availability">En stock</div>
</body>
</html>
