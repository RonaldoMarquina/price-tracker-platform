<!DOCTYPE html>
<html lang="es">
<head>
    <title>Monitor ASUS VY279HGR 27&quot; IPS FHD 120Hz - Sercoplus</title>
</head>
<body id="product">
    <h1 class="h1" itemprop="name">Monitor ASUS VY279HGR 27" IPS FHD 120Hz</h1>
    <div class="product-reference">
        <label>Referencia: </label>
        <span itemprop="sku">081040182</span>
    </div>
    <div class="product-prices">
        <!-- Shows both USD and PEN as Sercoplus typically displays in DOM -->
        <div class="current-price-usd">
            <span class="price-usd">$ 112.30</span>
        </div>
        <div class="current-price">
            <span class="price" itemprop="price">S/ 390.80</span>
        </div>
    </div>
    <div id="product-availability" class="product-availability">
        <span class="badge badge-success">En stock</span>
    </div>
    <button class="btn btn-primary add-to-cart" data-button-action="add-to-cart">
        Añadir al carrito
    </button>
</body>
</html>
